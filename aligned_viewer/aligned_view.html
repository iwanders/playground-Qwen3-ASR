<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>View Aligned ASRs</title>
    </head>

    <body>
        <style>
        .centeredtable {
          width: 100%;
          max-width: 60%;
          margin: 2rem auto; /* Centers the table */
          border-collapse: collapse;
          font-family: Arial, sans-serif;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .centeredtable th,
        .centeredtable td {
          padding: 12px 16px;
          text-align: left;
          border-bottom: 1px solid #e0e0e0;
        }

        .centeredtable th {
          background-color: #f8f9fa;
          font-weight: 600;
          color: #333;
          border-bottom: 2px solid #e0e0e0;
        }

        .centeredtable tr:hover {
          background-color: #f5f7fa;
        }

        .centeredtable tr:last-child td {
          border-bottom: none;
        }

        .modern-table tr:nth-child(even) {
          background-color: #f9f9f9;
        }

        @media (max-width: 768px) {
          .centeredtable {
            max-width: 90%;
          }
        }

        td.buttoncol,
        th.buttoncol {
          width: 5em;
        }

        td.timecol,
        th.timecol {
          width: 5em;
        }

        /* Define the flash animation */
        @keyframes flash-bg {
          0% {
            background-color: #ff3b3b; /* The flash color (e.g., bright yellow) */
          }
          100% {
            background-color: transparent; /* Fades back to the original background */
          }
        }

        /* The class that gets added during the event */
        .animate-flash {
          animation: flash-bg 1.8s ease-out; /* Adjust 0.8s to change flash duration */
        }
        </style>
        <div id="audio_section">
            <div id="waveform">
            <!-- the waveform will be rendered here -->
            </div>
            <button id="play_pause">(space) play/pause</button>Current time: <span id="display_timestamp"></span>
            tokens as list: <input type="checkbox" id="option-token-list" value="no">
            joined token delimiter: <input type="text" id="option-token-delimiter" value=" ">
            <button id="button_copy_yaml">YAML</button>
            import back (paste): <textarea id="import-yaml-code" style="resize: none; height: 0.8em;  overflow-y: hidden;"  rows="1" ></textarea>

        </div>

        <!--<p>
            Some issues reported upstream with timestamps, see <a href="https://github.com/QwenLM/Qwen3-ASR/issues/197">this</a> issue.
            There's a <a href="https://github.com/QwenLM/Qwen3-ASR/issues/197#issuecomment-5965450292">solution</a> proposed there that we may want to implement.

            Spacebar toggles play/pause.
            </p>-->
        <table id="relevant_segments" class="centeredtable">

        </table>

        <script type="module">
        //import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@8.0.0-beta.4/dist/wavesurfer.esm.js'
        import WaveSurfer from '/assets/wavesurfer.esm.js'
        import RegionsPlugin from '/assets/regions.esm.js'
        import ZoomPlugin from '/assets/zoom.esm.js'
        import Minimap from '/assets/minimap.esm.js'
        import Hover from '/assets/hover.esm.js'

        // Initialize the Regions plugin
        const regions = RegionsPlugin.create()

        const DECIMAL_RESOLUTION = 2;
        const DR = DECIMAL_RESOLUTION;

        const audio_filename = "/serve_file/this_is_our_awesome_audio_filename.mp3";
        const aligned_filename = "/serve_file/this_is_the_aligned_file.json";
        document.title = audio_filename;

        // Drag Selection: Create new regions by moving the cursor while holding left-click on the waveform
        let dragSelection = undefined

        const wavesurfer = WaveSurfer.create({
          container: '#waveform',
          waveColor: '#4F4A85',
          progressColor: '#383351',
          url: audio_filename,
          minPxPerSec: 100,

          // https://github.com/katspaugh/wavesurfer.js/issues/2738#issuecomment-3245624129
          backend: "WebAudio",
          plugins: [regions,
              ZoomPlugin.create({
                // the amount of zoom per wheel step, e.g. 0.5 means a 50% magnification per scroll
                scale: 0.25,
                // Optionally, specify the maximum pixels-per-second factor while zooming
                maxZoom: 100,
              }),
              // Register the plugin
              Minimap.create({
                height: 20,
                waveColor: '#ddd',
                progressColor: '#999',
                // the Minimap takes all the same options as the WaveSurfer itself
              }),
              Hover.create({
                lineColor: '#ff0000',
                lineWidth: 2,
                labelBackground: '#555',
                labelColor: '#fff',
                labelSize: '11px',
                labelPreferLeft: false,
                formatTimeCallback: (seconds) =>
                `${seconds.toFixed(2)}`

              }),
          ],
        })

        dragSelection = regions.enableDragSelection({
          color: 'rgba(255, 0, 0, 0.1)',
        })


        {
          let activeRegion = null
          regions.on('region-in', (region) => {
            console.log('region-in', region);
            //activeRegion = region
          })
          regions.on('region-out', (region) => {
            console.log('region-out', region);
            console.log('region-out active ', activeRegion);
            if (activeRegion === region ) {
                activeRegion = null;
            }
          })
          regions.on('region-clicked', (region, e) => {
            e.stopPropagation() // prevent triggering a click on the waveform
            activeRegion = region;
            region.play(true);
            //region.setOptions({ color: randomColor() });


            let el = document.getElementById(`fragment-span-${region.id}`);
            if (el !== undefined){
                // Add the class to trigger the animation
                el.classList.add('animate-flash');

                // Remove the class after the animation finishes so it can flash again next click
                el.addEventListener('animationend', () => {
                    el.classList.remove('animate-flash');
                }, { once: true }); // { once: true } ensures the listener cleans itself up

            }

          })
          // Reset the active region when the user clicks anywhere in the waveform
          wavesurfer.on('interaction', () => {
            activeRegion = null;
          })
          /** When the audio pauses */
          wavesurfer.on('pause', () => {
              if (activeRegion !== null && wavesurfer.getCurrentTime() >= activeRegion.end){
                  activeRegion = null;
              }
          })

        }

        document.querySelector('#play_pause').addEventListener('click', () => {
          wavesurfer.playPause()
        })

        /** On audio position change, fires continuously during playback */
        wavesurfer.on('timeupdate', (currentTime) => {
            document.querySelector('#display_timestamp').innerHTML = `${currentTime.toFixed(DR)}`;

        })


        // Segment: region -> {tokens: []}.
        let audio_segments = new Map();
        let extra_cols = [];
        let asr_data = null;

        function update_segment(region, entry) {
            if (asr_data === null){
                return;
            }
            let tokens = [];
            for (let i = 0; i < asr_data.fragments.length; i++) {
                if (asr_data.fragments[i].start_time > region.start && asr_data.fragments[i].end_time <= region.end) {
                    tokens.push(asr_data.fragments[i].text);
                }
            }
            entry.tokens = tokens;
        }
        function region_is_custom(region) {
            return !region.id.startsWith("fragment-") && !region.id.startsWith("segment-") ;
        }

        function format_tokens(tokens){
            let token_display_str = '';
            let token_list = document.getElementById('option-token-list').checked;
            let token_delim = document.getElementById('option-token-delimiter').value;
            console.log(token_list, token_delim);
            if (token_list) {
                token_display_str  += "[";
                token_display_str +=  tokens.forEach((z) => `"${z}"`).join(', ');

                token_display_str  += "]";
            } else {
                token_display_str = '"' + tokens.join(token_delim) + '"';
            };
            return token_display_str;
        }

        function update_segment_display(){
            // Relevant_segments
            let new_segment_elements = []
            const table_heading = document.createElement("tr");
            let build_in_cols = ['', 'start', 'end', 'tokens', ''];

            for (let v of build_in_cols){
                const col0 = document.createElement("th");
                if (v == "start" || v == "end") {
                    col0.classList.add("timecol");
                } else if (v == ''){
                    col0.classList.add("buttoncol");
                }
                col0.textContent =  v;
                table_heading.appendChild(col0);
            }

            new_segment_elements.push(table_heading);


            audio_segments.forEach((v, k) => {
                const newPara = document.createElement("tr");
                newPara.id = `fragment-span-${k.id}`;

                // 2. Configure it (add text, classes, and IDs)
                console.log(k,v);
                const play_td = document.createElement("td");
                play_td.classList.add("buttoncol");
                const play_button = document.createElement("button");
                play_button.textContent = "play";
                play_button.addEventListener("click",   () => {
                    k.play(true);
                });
                play_td.append(play_button);
                newPara.prepend(play_td);


                // start

                const start_td = document.createElement("td");
                start_td.textContent = `${k.start.toFixed(DR)}`;
                start_td.classList.add("timecol");
                newPara.appendChild(start_td);
                // end
                const end_td = document.createElement("td");
                end_td.classList.add("timecol");
                end_td.textContent = `${k.end.toFixed(DR)}`;
                newPara.appendChild(end_td);

                // tokens.
                const body_td = document.createElement("td");
                let token_display_str = format_tokens(v.tokens);

                body_td.textContent = token_display_str;
                newPara.appendChild(body_td);

                const delete_td = document.createElement("td");
                delete_td.classList.add("buttoncol");
                const delete_button = document.createElement("button");
                delete_button.textContent = "del";
                delete_button.addEventListener("click",   () => {
                    k.remove();
                    audio_segments.delete(k);
                    update_segment_display();
                });
                delete_td.append(delete_button);



                newPara.appendChild(delete_td);
                new_segment_elements.push(newPara);
            });
            document.getElementById("relevant_segments").replaceChildren(...new_segment_elements);
        }

        document.getElementById('button_copy_yaml').addEventListener('click', async () => {
          try {
            let yaml_text = ''
            audio_segments.forEach((v, k) => {
                let start_str = `${k.start.toFixed(DR)}`;
                let end_str = `${k.end.toFixed(DR)}`;
                let tokens = format_tokens(v.tokens);
                yaml_text += `- { start: ${start_str}, end: ${end_str}, tokens: ${tokens}}\n`;
            });

            await navigator.clipboard.writeText(yaml_text);
          } catch (err) {
            console.error('Failed to copy buffer: ', err);
          }
        });


        function parse_yaml_like(s) {
            // - { start: 10.25, end: 11.58 }
            const lines = s.trim().split(/\r?\n/);
            const result = [];
            const tokenRegex = /tokens:\s*"([^"]+)"/;

            for (const line of lines) {
              const trimmedLine = line.trim();

              // Skip empty lines and comment lines
              if (!trimmedLine || trimmedLine.startsWith('#')) {
                continue;
              }

              // Remove inline comments (anything after #)
              const cleanLine = trimmedLine.split('#')[0].trim();
              if (!cleanLine) continue;

              // Flexible regex allowing variable whitespace
              const regex = /^-\s*\{\s*start:\s*(\d+\.?\d*),\s*end:\s*(\d+\.?\d*),\s*tokens:\s*"([^"]+)"\s*\}/;

              const match = cleanLine.match(regex);
              if (match) {
                result.push({
                  start: parseFloat(match[1]),
                  end: parseFloat(match[2]),
                  tokens: match[3].replace(/\s+/g, ' ') // Normalize whitespace
                });
              }
            }

            return result;
        }
        // import-yaml-code
        let import_input = document.getElementById("import-yaml-code");
        import_input.addEventListener("input", (e) => {
            let val  = import_input.value;
            if (val != "") {
                let entries = parse_yaml_like(val);
                console.log(entries);
                // regions.clearRegions();
                const allRegions = regions.getRegions();
                for (let r of allRegions) {
                    if (r.id.startsWith("fragment-") || r.id.startsWith("segment-")){
                        continue;
                    }
                    re.remove();
                }
                // console.log(allRegions); // Returns an array of Region objects
                for (let z of entries) {
                    console.log(z);
                    regions.addRegion({
                        start: z.start,
                        end: z.end,
                        color: 'rgba(255, 0, 0, 0.1)' // Semi-transparent red
                        //content: frag.text
                    });
                }
            }
            import_input.value = "";
        });

        /** On audio position change, fires continuously during playback */
        regions.on('region-created', (region) => {
            if (!region_is_custom(region)){
                return;
            }
            console.log("region created", region);
            audio_segments.set(region, {});
            update_segment(region, audio_segments.get(region));

            update_segment_display();
        })
        regions.on('region-updated',(region, update_side) => {
            if (!region_is_custom(region)){
                return;
            }
            update_segment(region, audio_segments.get(region));
            update_segment_display();
        });

        // Give regions a random color when they are created
        const random = (min, max) => Math.random() * (max - min) + min
        const randomColor = () => `rgba(${random(0, 255)}, ${random(0, 255)}, ${random(0, 255)}, 0.5)`

        function add_regions(data) {
            asr_data = data;
            let segment_index = 0;
            const COLOR_MAP = ['rgba(224, 224, 224, 0.5)', 'rgba(180, 180, 180, 0.5)'];
            for (let segment_index = 0; segment_index < data.fragments.length; segment_index++){
                let frag =  data.fragments[segment_index];
            // for (let frag of data.fragments){
                //console.log(frag);
                regions.addRegion({
                  start: frag.start_time,
                  end: frag.end_time,
                  content: frag.text,
                  // color: randomColor(),
                  color: COLOR_MAP[segment_index % 2],
                  drag: false,
                  resize: false,
                  id: `fragment-${segment_index}`,
                });
            }
            for (let i = 0; i < data.chunks.length; i++) {

                // Markers (zero-length regions)
                regions.addRegion({
                  start: data.chunks[i].fragments[0].start_time,
                  content: `Segment ${i}`,
                  id: `segment-${i}`,
                  color: randomColor(),
                })
            }
        }

        async function retrieve_asr() {
          try {
            // 1. Fetch the data from the API
            const response = await fetch(aligned_filename);

            // 2. Check if the network request was successful (status 200-299)
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }

            // 3. Parse the response body as JSON
            const data = await response.json();

            // 4. Do something with the data!
            console.log("User Data:", data);

            add_regions(data)

          } catch (error) {
            // Handle network errors or parsing errors
            console.error("Could not fetch data:", error);
          }
        }



        // Fired when the audio has loaded, decoded, and the waveform is drawn
        wavesurfer.on('ready', (duration) => {
          console.log('WaveSurfer is ready! Duration:', duration);
          // Call the function
          //
          // From old docs at https://wavesurfer.xyz/plugins/regions
          // addRegion(options) – Creates a region on the waveform. Returns a Region object. See Region Options, Region Methods and Region Events below. Note: You cannot add regions until the audio has finished loading, otherwise the start: and end: properties of the new region will be set to 0, or an unexpected value.
          retrieve_asr();
        });


        // Add shift+scroll to pan.
        // https://github.com/katspaugh/wavesurfer.js/issues/3389#issuecomment-2053811603
        const horizontalScrolling = e => {
            console.log(e);
            if (e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                e.target.closest('.scroll').scrollLeft -= e.deltaY;
            }
        };
        const wavesurferWrapper = wavesurfer.getWrapper();
        wavesurferWrapper.addEventListener('wheel', horizontalScrolling, true);

        window.addEventListener('keydown', function(event) {
          // Check if the pressed key is the spacebar
          if (event.key === ' ' || event.code === 'Space') {
            const el = document.activeElement;

            if (el && el.tagName === 'INPUT' && el.type === 'text') {
                console.log('A text input is currently focused.');
                return;
            }
            // Prevent the default browser action (like scrolling down the page)
            //event.preventDefault();

            // Find your specific button by its ID and click it
            const myButton = document.getElementById('play_pause');
            if (myButton) {
              myButton.click();
            }
          }
        });
        </script>
    </body>
</html>
